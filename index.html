<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ByteSearch - A modern, lightweight search engine interface with quick access to popular web services and Wikipedia.">
    <meta name="keywords" content="search engine, Wikipedia, Google, YouTube, Facebook, web search">
    <meta name="author" content="ByteSearch Development Team">
    <meta name="theme-color" content="#168cff">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="ByteSearch - Search Smarter. See More.">
    <meta property="og:description" content="A modern, lightweight search engine interface with quick access to popular web services and Wikipedia.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hs9026442-byte.github.io/my-search-engine/">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ByteSearch">
    <meta name="twitter:description" content="A modern, lightweight search engine interface.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23168cff' width='100' height='100' rx='20'/><text x='50' y='70' font-size='70' font-weight='bold' fill='%23020817' text-anchor='middle'>B</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23168cff' width='180' height='180' rx='30'/><text x='90' y='130' font-size='120' font-weight='bold' fill='%23020817' text-anchor='middle'>B</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <title>ByteSearch - Search Smarter. See More.</title>
</head>

<body>
    <!-- Navigation -->
    <nav role="navigation" aria-label="Main navigation">
        <div class="logo" onclick="window.location.href='index.html'" tabindex="0" role="button" aria-label="ByteSearch Home">
            <div class="logo-icon" aria-hidden="true">B</div>
            <div>
                <span class="byte">Byte</span><span class="search-word">Search</span>
            </div>
        </div>

        <div>
            <a href="index.html">Home</a>
            <a href="#" aria-label="Search">Search</a>
            <a href="#" aria-label="About ByteSearch">About</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main role="main">
        <!-- Logo -->
        <div class="big-logo" aria-hidden="true">B</div>

        <!-- Title -->
        <h1>
            Byte<span>Search</span>
        </h1>

        <!-- Tagline -->
        <p class="tagline">SEARCH SMARTER. SEE MORE.</p>

        <!-- Search Bar -->
        <form class="search-area" onsubmit="search(); return false;">
            <input
                id="searchBox"
                type="text"
                placeholder="Search the web..."
                aria-label="Search input"
                autocomplete="off"
            >
            <button type="submit" aria-label="Search button">🔍 Search</button>
        </form>

        <!-- Quick Search -->
        <h2 class="quick-title">Quick Search</h2>
        <div class="quick" role="group" aria-label="Quick search options">
            <button onclick="quickSearch('Google')" aria-label="Quick search Google">Google</button>
            <button onclick="quickSearch('YouTube')" aria-label="Quick search YouTube">YouTube</button>
            <button onclick="quickSearch('Facebook')" aria-label="Quick search Facebook">Facebook</button>
            <button onclick="quickSearch('Wikipedia')" aria-label="Quick search Wikipedia">Wikipedia</button>
        </div>
    </main>

    <!-- Footer -->
    <footer role="contentinfo">
        © 2026 ByteSearch • Search Smarter. See More. | <a href="#">Privacy</a> • <a href="#">Terms</a>
    </footer>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
