<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ByteSearch — Search Smarter</title>
  <meta name="description" content="ByteSearch — a clean, fast search UX that surfaces concise summaries from trusted sources (example: Wikipedia).">

  <!-- Open Graph / Social -->
  <meta property="og:title" content="ByteSearch" />
  <meta property="og:description" content="Search smarter — concise summaries and quick links." />
  <meta property="og:image" content="/images/logo.svg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/images/logo.svg" alt="ByteSearch logo" class="logo-img">
        <span class="brand-text"><span class="brand-strong">Byte</span>Search</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/results.html">Search</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main class="container" id="main">
    <section class="hero">
      <div class="hero-content">
        <h1 class="title">Search smarter. See more.</h1>
        <p class="subtitle">Concise summaries and quick links — demo powered by public sources.</p>

        <form class="search-form" action="/results.html" method="get" role="search" aria-label="Site search">
          <label for="q" class="sr-only">Search query</label>
          <div class="search-input-wrap">
            <input id="q" name="q" type="search" placeholder="Search the web — try “JavaScript” or “Tokyo”" aria-label="Search" autocomplete="off">
            <button type="submit" class="btn-primary">🔍 Search</button>
          </div>
        </form>

        <div class="quick">
          <button class="quick-btn" data-q="Google">Google</button>
          <button class="quick-btn" data-q="YouTube">YouTube</button>
          <button class="quick-btn" data-q="Wikipedia">Wikipedia</button>
        </div>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <img src="/images/logo.svg" alt="" class="hero-logo">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2026 ByteSearch • Demo — results come from public APIs (Wikipedia)</small>
    </div>
  </footer>

  <script src="/assets/main.js" defer></script>
</body>
</html>
