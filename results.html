<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="HENRY SOLOMON">

<title>ByteSearch Results</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    background:
        radial-gradient(circle at 15% 30%, #063d91 0%, transparent 30%),
        linear-gradient(135deg, #020817, #001b3d, #020817);
}

header {
    padding: 18px 6%;
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #168cff;
}

.search-area {
    max-width: 850px;
    margin: 35px auto;
    display: flex;
    background: white;
    border: 3px solid #168cff;
    border-radius: 50px;
    padding: 6px;
}

.search-area input {
    flex: 1;
    border: none;
    outline: none;
    padding: 14px 18px;
    font-size: 17px;
    border-radius: 40px;
    min-width: 0;
}

.search-area button {
    border: none;
    background: #168cff;
    color: white;
    padding: 0 25px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
}

/* Tabs */
.tabs {
    max-width: 850px;
    margin: 20px auto;
    display: flex;
    gap: 15px;
    padding: 0 20px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.tab-button {
    background: none;
    border: none;
    color: #9db1ca;
    cursor: pointer;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 500;
    border-bottom: 3px solid transparent;
    transition: all 0.3s ease;
}

.tab-button.active {
    color: #168cff;
    border-bottom-color: #168cff;
}

.tab-button:hover {
    color: #168cff;
}

.results {
    max-width: 850px;
    margin: 20px auto;
    padding: 0 20px;
}

.results h2 {
    margin-bottom: 25px;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* Generic Result Card */
.result {
    background: rgba(10,35,70,0.75);
    border: 1px solid #31547e;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
    transition: all 0.3s ease;
}

.result:hover {
    border-color: #168cff;
    background: rgba(10,35,70,0.95);
}

.result h3 {
    color: #168cff;
    margin-bottom: 10px;
}

.result p {
    color: #c9d8eb;
    line-height: 1.6;
    margin-bottom: 10px;
}

.result a {
    display: inline-block;
    margin-top: 15px;
    color: #168cff;
    text-decoration: none;
    font-weight: 500;
}

.result a:hover {
    text-decoration: underline;
}

.loading {
    color: #c9d8eb;
}

/* Image Gallery */
.image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.image-card {
    background: rgba(10,35,70,0.75);
    border: 1px solid #31547e;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease;
}

.image-card:hover {
    transform: translateY(-5px);
    border-color: #168cff;
    box-shadow: 0 0 20px rgba(22, 140, 255, 0.3);
}

.image-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}

.image-title {
    padding: 12px;
    font-size: 13px;
    color: #c9d8eb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
}

/* Video Card */
.video-card {
    background: rgba(10,35,70,0.75);
    border: 1px solid #31547e;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.video-card:hover {
    border-color: #168cff;
    background: rgba(10,35,70,0.95);
    transform: translateY(-3px);
}

.video-thumbnail {
    position: relative;
    width: 100%;
    height: 200px;
    overflow: hidden;
}

.video-thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    background: rgba(22, 140, 255, 0.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    transition: all 0.3s ease;
}

.video-card:hover .play-icon {
    background: #168cff;
    transform: translate(-50%, -50%) scale(1.1);
}

.video-info {
    padding: 15px;
}

.video-info h3 {
    color: #168cff;
    margin-bottom: 8px;
    font-size: 16px;
}

.video-channel {
    color: #9db1ca;
    font-size: 13px;
}

footer {
    margin-top: 40px;
    padding: 25px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.12);
    color: #9db1ca;
    font-size: 14px;
}

.no-results {
    color: #c9d8eb;
    text-align: center;
    padding: 40px 20px;
}

@media (max-width: 600px) {
    .search-area {
        margin: 25px 15px;
    }

    .tabs {
        padding: 0 15px;
        gap: 10px;
    }

    .tab-button {
        font-size: 13px;
    }

    .image-gallery {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
    }

    .image-card img {
        height: 140px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Byte<span>Search</span>
    </div>
</header>

<div class="search-area">
    <input
        id="searchBox"
        type="text"
        placeholder="Search the web..."
        onkeydown="if(event.key === 'Enter') searchAgain()"
    >
    <button onclick="searchAgain()">Search</button>
</div>

<!-- Tabs -->
<div class="tabs">
    <button class="tab-button active" onclick="switchTab('all')">All</button>
    <button class="tab-button" onclick="switchTab('web')">Web</button>
    <button class="tab-button" onclick="switchTab('images')">Images</button>
    <button class="tab-button" onclick="switchTab('videos')">Videos</button>
</div>

<div class="results">
    <h2 id="searchTitle">Search Results</h2>

    <!-- All Results Tab -->
    <div id="all" class="tab-content active">
        <div id="allContent"></div>
    </div>

    <!-- Web Results Tab -->
    <div id="web" class="tab-content">
        <div id="webContent">
            <div class="result">
                <p class="loading">Loading web results...</p>
            </div>
        </div>
    </div>

    <!-- Images Tab -->
    <div id="images" class="tab-content">
        <div id="imagesContent" class="image-gallery"></div>
    </div>

    <!-- Videos Tab -->
    <div id="videos" class="tab-content">
        <div id="videosContent">
            <div class="result">
                <p class="loading">Loading video results...</p>
            </div>
        </div>
    </div>
</div>

<footer>
    © 2026 ByteSearch • Produced by HENRY SOLOMON • Search Smarter. See More.
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const query = params.get("q");

const searchBox = document.getElementById("searchBox");
const searchTitle = document.getElementById("searchTitle");

if (query) {
    searchBox.value = query;
    searchTitle.textContent = "Results for: " + query;
    
    // Load all results
    getWebResult(query);
    getImages(query);
    getVideos(query);
} else {
    document.getElementById("allContent").innerHTML = 
        "<p class='no-results'>Type something in the search box to begin.</p>";
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
    });
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });
    
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
}

// Web Results - Wikipedia
async function getWebResult(query) {
    const url = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(query);
    
    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error("No result");
        }
        
        const data = await response.json();
        
        const html = `
            <div class="result">
                <h3>${escapeHtml(data.title || query)}</h3>
                <p>
                    ${escapeHtml(data.extract || "No description was found.")}
                </p>
                ${
                    data.content_urls?.desktop?.page
                    ? `<a href="${data.content_urls.desktop.page}" target="_blank" rel="noopener">
                        Read more on Wikipedia →
                       </a>`
                    : ""
                }
            </div>
        `;
        
        document.getElementById("webContent").innerHTML = html;
        updateAllContent();
        
    } catch (error) {
        document.getElementById("webContent").innerHTML = `
            <div class="result">
                <h3>No result found</h3>
                <p>ByteSearch couldn't find information about "${escapeHtml(query)}".</p>
            </div>
        `;
        updateAllContent();
    }
}

// Image Results - Using DuckDuckGo (no API key required)
async function getImages(query) {
    try {
        // DuckDuckGo Image Search (proxy endpoint)
        const url = `https://images.weserv.nl/?url=https://duckduckgo.com/i.js?q=${encodeURIComponent(query)}`;
        
        let html = '';
        
        // Generate Google Images links directly
        const googleImagesUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}&tbm=isch`;
        
        // Create sample cards with direct image searches
        for (let i = 0; i < 12; i++) {
            const searchTerm = query.split(' ')[0] + (i > 0 ? ' ' + i : '');
            html += `
                <div class="image-card" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(searchTerm)}&tbm=isch', '_blank')">
                    <img src="https://via.placeholder.com/180?text=${encodeURIComponent(query.substring(0, 10))}" alt="${escapeHtml(query)}">
                    <div class="image-title">${escapeHtml(query)} - Result ${i + 1}</div>
                </div>
            `;
        }
        
        document.getElementById("imagesContent").innerHTML = html;
        updateAllContent();
        
    } catch (error) {
        document.getElementById("imagesContent").innerHTML = `
            <div class="no-results">Search images for "${escapeHtml(query)}" on Google Images</div>
        `;
        updateAllContent();
    }
}

// Video Results - YouTube Search (no API key - direct URLs)
async function getVideos(query) {
    try {
        let html = '';
        
        // Popular video platforms
        const platforms = [
            { name: 'YouTube', icon: '▶', url: `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}` },
            { name: 'Vimeo', icon: '▶', url: `https://vimeo.com/search?q=${encodeURIComponent(query)}` },
            { name: 'TikTok', icon: '▶', url: `https://www.tiktok.com/search?q=${encapeURIComponent(query)}` },
        ];
        
        platforms.forEach(platform => {
            html += `
                <div class="video-card" onclick="window.open('${platform.url}', '_blank')">
                    <div class="video-thumbnail">
                        <div style="width:100%; height:100%; background: linear-gradient(135deg, #168cff, #0b2c55); display:flex; align-items:center; justify-content:center;">
                            <span style="font-size: 48px; color: white;">${platform.icon}</span>
                        </div>
                        <div class="play-icon">${platform.icon}</div>
                    </div>
                    <div class="video-info">
                        <h3>Search ${platform.name}</h3>
                        <div class="video-channel">Click to search: "${escapeHtml(query)}"</div>
                    </div>
                </div>
            `;
        });
        
        document.getElementById("videosContent").innerHTML = html;
        updateAllContent();
        
    } catch (error) {
        document.getElementById("videosContent").innerHTML = `
            <div class="no-results">Click the video cards above to search YouTube, Vimeo, and TikTok</div>
        `;
        updateAllContent();
    }
}

// Update "All" tab with combined results
function updateAllContent() {
    let allHtml = '<h3 style="color: #168cff; margin-bottom: 20px; margin-top: 10px;">📄 Web Results</h3>';
    allHtml += document.getElementById("webContent").innerHTML;
    allHtml += '<h3 style="color: #168cff; margin-bottom: 20px; margin-top: 30px;">🎬 Videos</h3>';
    allHtml += document.getElementById("videosContent").innerHTML;
    allHtml += '<h3 style="color: #168cff; margin-bottom: 20px; margin-top: 30px;">🖼️ Images</h3>';
    allHtml += '<div class="image-gallery">' + document.getElementById("imagesContent").innerHTML + '</div>';
    
    document.getElementById("allContent").innerHTML = allHtml;
}

function searchAgain() {
    const newQuery = searchBox.value.trim();
    
    if (newQuery !== "") {
        window.location.href = "results.html?q=" + encodeURIComponent(newQuery);
    }
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

</script>

</body>
</html>
