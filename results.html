<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ByteSearch Results - View your search results powered by Wikipedia.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#168cff">

    <!-- Styles -->
    <link rel="stylesheet" href="css/results.css">

    <title>ByteSearch Results</title>
</head>

<body>
    <!-- Header -->
    <header role="banner">
        <div class="logo" onclick="window.location.href='index.html'" tabindex="0" role="button" aria-label="ByteSearch Home">
            <a href="index.html" aria-label="Return to ByteSearch home">Byte<span>Search</span></a>
        </div>
    </header>

    <!-- Search Bar -->
    <form class="search-area" onsubmit="searchAgain(); return false;">
        <input
            id="searchBox"
            type="text"
            placeholder="Search the web..."
            aria-label="Search input"
            autocomplete="off"
        >
        <button type="submit" aria-label="Search button">Search</button>
    </form>

    <!-- Results Container -->
    <div class="results" role="main">
        <h1 id="searchTitle" class="visually-hidden">Search Results</h1>
        <h2 id="searchTitle">Search Results</h2>
        <div id="resultContent" class="result">
            <p class="loading">Loading results...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer role="contentinfo">
        <div style="text-align: center; padding: 20px; color: #9db1ca; font-size: 12px;">
            Powered by Wikipedia • © 2026 ByteSearch
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
