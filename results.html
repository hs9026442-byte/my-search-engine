<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ByteSearch Results</title>
  <meta name="description" content="Search results and concise summaries — demo powered by Wikipedia REST API.">

  <!-- Open Graph -->
  <meta property="og:title" content="ByteSearch Results" />
  <meta property="og:description" content="Search results and concise summaries." />
  <meta property="og:image" content="/images/logo.svg" />

  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/images/logo.svg" alt="ByteSearch logo" class="logo-img">
        <span class="brand-text"><span class="brand-strong">Byte</span>Search</span>
      </a>
    </div>
  </header>

  <main class="container">
    <section class="results-section">
      <form class="search-form results-search" onsubmit="return false;" role="search" aria-label="Refine search">
        <label for="q-results" class="sr-only">Search query</label>
        <div class="search-input-wrap">
          <input id="q-results" name="q" type="search" placeholder="Search the web..." aria-label="Search" autocomplete="off">
          <button id="btn-search" class="btn-primary">Search</button>
        </div>
      </form>

      <h2 id="searchTitle" class="results-title">Search Results</h2>

      <div id="resultArea" class="result-area" aria-live="polite">
        <div class="card loading" id="loadingState">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading results…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2026 ByteSearch</small>
    </div>
  </footer>

  <script src="/assets/main.js" defer></script>
</body>
</html>
