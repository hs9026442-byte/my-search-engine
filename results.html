<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="HENRY SOLOMON">

<title>ByteSearch Results</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    background:
        radial-gradient(circle at 15% 30%, #063d91 0%, transparent 30%),
        linear-gradient(135deg, #020817, #001b3d, #020817);
}

header {
    padding: 18px 6%;
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #168cff;
}

.search-area {
    max-width: 850px;
    margin: 35px auto;
    display: flex;
    background: white;
    border: 3px solid #168cff;
    border-radius: 50px;
    padding: 6px;
}

.search-area input {
    flex: 1;
    border: none;
    outline: none;
    padding: 14px 18px;
    font-size: 17px;
    border-radius: 40px;
    min-width: 0;
}

.search-area button {
    border: none;
    background: #168cff;
    color: white;
    padding: 0 25px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
}

.results {
    max-width: 850px;
    margin: 20px auto;
    padding: 0 20px;
}

.results h2 {
    margin-bottom: 25px;
}

.result {
    background: rgba(10,35,70,0.75);
    border: 1px solid #31547e;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
}

.result h3 {
    color: #168cff;
    margin-bottom: 10px;
}

.result p {
    color: #c9d8eb;
    line-height: 1.6;
}

.result a {
    display: inline-block;
    margin-top: 15px;
    color: #168cff;
}

.loading {
    color: #c9d8eb;
}

/* Image Gallery */
.images-section {
    margin-top: 40px;
}

.images-section h2 {
    margin-bottom: 20px;
    font-size: 22px;
}

.image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.image-card {
    background: rgba(10,35,70,0.75);
    border: 1px solid #31547e;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease;
}

.image-card:hover {
    transform: translateY(-5px);
    border-color: #168cff;
    box-shadow: 0 0 20px rgba(22, 140, 255, 0.3);
}

.image-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}

.image-title {
    padding: 12px;
    font-size: 13px;
    color: #c9d8eb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}

.no-images {
    color: #c9d8eb;
    text-align: center;
    padding: 20px;
}

footer {
    margin-top: 40px;
    padding: 25px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.12);
    color: #9db1ca;
    font-size: 14px;
}

@media (max-width: 600px) {
    .search-area {
        margin: 25px 15px;
    }

    .search-area button {
        padding: 0 17px;
    }

    .image-gallery {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
    }

    .image-card img {
        height: 140px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Byte<span>Search</span>
    </div>
</header>

<div class="search-area">

    <input
        id="searchBox"
        type="text"
        placeholder="Search the web..."
        onkeydown="if(event.key === 'Enter') searchAgain()"
    >

    <button onclick="searchAgain()">Search</button>

</div>

<div class="results">

    <h2 id="searchTitle">Search Results</h2>

    <div id="resultContent" class="result">
        <p class="loading">Loading results...</p>
    </div>

    <!-- Images Section -->
    <div class="images-section" id="imagesSection" style="display: none;">
        <h2>Images</h2>
        <div id="imageGallery" class="image-gallery"></div>
    </div>

</div>

<footer>
    © 2026 ByteSearch • Produced by HENRY SOLOMON • Search Smarter. See More.
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const query = params.get("q");

const searchBox = document.getElementById("searchBox");
const searchTitle = document.getElementById("searchTitle");
const resultContent = document.getElementById("resultContent");
const imagesSection = document.getElementById("imagesSection");
const imageGallery = document.getElementById("imageGallery");

if (query) {
    searchBox.value = query;
    searchTitle.textContent = "Results for: " + query;
    getResult(query);
    getImages(query);
} else {
    resultContent.innerHTML =
        "<p>Type something in the search box to begin.</p>";
}

async function getResult(query) {

    const url =
        "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(query);

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("No result");
        }

        const data = await response.json();

        resultContent.innerHTML = `
            <h3>${escapeHtml(data.title || query)}</h3>

            <p>
                ${escapeHtml(
                    data.extract || "No description was found."
                )}
            </p>

            ${
                data.content_urls?.desktop?.page
                ? `<a href="${data.content_urls.desktop.page}"
                     target="_blank"
                     rel="noopener">
                     Read more on Wikipedia →
                   </a>`
                : ""
            }
        `;

    } catch (error) {

        resultContent.innerHTML = `
            <h3>No result found</h3>

            <p>
                ByteSearch couldn't find information about
                "${escapeHtml(query)}".
            </p>
        `;
    }
}

async function getImages(query) {
    try {
        // Using Bing Image Search API via RapidAPI
        const url = "https://bing-image-search1.p.rapidapi.com/images/search?q=" + encodeURIComponent(query);
        
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'x-rapidapi-key': 'demo', // Replace with actual API key
                'x-rapidapi-host': 'bing-image-search1.p.rapidapi.com'
            }
        });

        if (!response.ok) {
            throw new Error("Failed to fetch images");
        }

        const data = await response.json();
        
        if (data.value && data.value.length > 0) {
            imagesSection.style.display = "block";
            imageGallery.innerHTML = "";
            
            // Display first 12 images
            data.value.slice(0, 12).forEach(image => {
                const imageCard = document.createElement("div");
                imageCard.className = "image-card";
                imageCard.innerHTML = `
                    <img src="${escapeHtml(image.thumbnail.contentUrl)}" 
                         alt="${escapeHtml(image.name)}"
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2216%22 fill=%22%23666%22%3EImage not available%3C/text%3E%3C/svg%3E'">
                    <div class="image-title">${escapeHtml(image.name)}</div>
                `;
                
                imageCard.addEventListener("click", () => {
                    window.open(image.contentUrl, "_blank");
                });
                
                imageGallery.appendChild(imageCard);
            });
        }

    } catch (error) {
        console.error("Error fetching images:", error);
        // Silently fail - don't disrupt the text results
    }
}

function searchAgain() {

    const newQuery =
        searchBox.value.trim();

    if (newQuery !== "") {

        window.location.href =
            "results.html?q=" +
            encodeURIComponent(newQuery);
    }
}

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
