<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="HENRY SOLOMON">

<title>ByteSearch Results</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    background:
        radial-gradient(circle at 15% 30%, #063d91 0%, transparent 30%),
        linear-gradient(135deg, #020817, #001b3d, #020817);
}

header {
    padding: 18px 6%;
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #168cff;
}

.search-area {
    max-width: 850px;
    margin: 35px auto;
    display: flex;
    background: white;
    border: 3px solid #168cff;
    border-radius: 50px;
    padding: 6px;
}

.search-area input {
    flex: 1;
    border: none;
    outline: none;
    padding: 14px 18px;
    font-size: 17px;
    border-radius: 40px;
    min-width: 0;
}

.search-area button {
    border: none;
    background: #168cff;
    color: white;
    padding: 0 25px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
}

.results {
    max-width: 850px;
    margin: 20px auto;
    padding: 0 20px;
}

.results h2 {
    margin-bottom: 25px;
}

.result {
    background: rgba(10,35,70,0.75);
    border: 1px solid #31547e;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
}

.result:hover {
    border-color: #168cff;
}

.result h3 {
    color: #168cff;
    margin-bottom: 10px;
}

.result p {
    color: #c9d8eb;
    line-height: 1.6;
    margin-bottom: 10px;
}

.result a {
    display: inline-block;
    margin-top: 15px;
    color: #168cff;
    text-decoration: none;
}

.result a:hover {
    text-decoration: underline;
}

.loading {
    color: #c9d8eb;
}

/* Quick Links */
.quick-links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin: 30px 0;
}

.quick-link {
    background: rgba(22, 140, 255, 0.2);
    border: 1px solid #168cff;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
}

.quick-link:hover {
    background: rgba(22, 140, 255, 0.4);
    transform: translateY(-5px);
}

.quick-link-icon {
    font-size: 32px;
    margin-bottom: 10px;
}

.quick-link-title {
    color: #168cff;
    font-weight: bold;
    margin-bottom: 5px;
}

.quick-link-desc {
    color: #9db1ca;
    font-size: 13px;
}

footer {
    margin-top: 40px;
    padding: 25px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.12);
    color: #9db1ca;
    font-size: 14px;
}

@media (max-width: 600px) {
    .search-area {
        margin: 25px 15px;
    }

    .quick-links {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Byte<span>Search</span>
    </div>
</header>

<div class="search-area">
    <input
        id="searchBox"
        type="text"
        placeholder="Search the web..."
        onkeydown="if(event.key === 'Enter') searchAgain()"
    >
    <button onclick="searchAgain()">Search</button>
</div>

<div class="results">
    <h2 id="searchTitle">Search Results</h2>

    <!-- Web Results -->
    <div id="webContent">
        <div class="result">
            <p class="loading">Loading web results...</p>
        </div>
    </div>

    <!-- Quick Search Links -->
    <h3 style="color: #168cff; margin-top: 40px; margin-bottom: 20px;">🔍 Search on Other Platforms</h3>
    <div class="quick-links">
        <div class="quick-link" onclick="searchOn('google')">
            <div class="quick-link-icon">🔗</div>
            <div class="quick-link-title">Google</div>
            <div class="quick-link-desc">Web Search</div>
        </div>
        <div class="quick-link" onclick="searchOn('images')">
            <div class="quick-link-icon">🖼️</div>
            <div class="quick-link-title">Google Images</div>
            <div class="quick-link-desc">Image Search</div>
        </div>
        <div class="quick-link" onclick="searchOn('youtube')">
            <div class="quick-link-icon">🎬</div>
            <div class="quick-link-title">YouTube</div>
            <div class="quick-link-desc">Video Search</div>
        </div>
        <div class="quick-link" onclick="searchOn('wikipedia')">
            <div class="quick-link-icon">📖</div>
            <div class="quick-link-title">Wikipedia</div>
            <div class="quick-link-desc">Knowledge Base</div>
        </div>
        <div class="quick-link" onclick="searchOn('reddit')">
            <div class="quick-link-icon">💬</div>
            <div class="quick-link-title">Reddit</div>
            <div class="quick-link-desc">Community</div>
        </div>
        <div class="quick-link" onclick="searchOn('twitter')">
            <div class="quick-link-icon">𝕏</div>
            <div class="quick-link-title">Twitter/X</div>
            <div class="quick-link-desc">Social Media</div>
        </div>
    </div>
</div>

<footer>
    © 2026 ByteSearch • Produced by HENRY SOLOMON • Search Smarter. See More.
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const query = params.get("q");

const searchBox = document.getElementById("searchBox");
const searchTitle = document.getElementById("searchTitle");
const webContent = document.getElementById("webContent");

if (query) {
    searchBox.value = query;
    searchTitle.textContent = "Results for: " + query;
    getWebResult(query);
} else {
    webContent.innerHTML = 
        "<p style='color: #c9d8eb; text-align: center; padding: 40px;'>Type something in the search box to begin.</p>";
}

// Web Results - Wikipedia
async function getWebResult(query) {
    const url = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(query);
    
    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error("No result");
        }
        
        const data = await response.json();
        
        const html = `
            <div class="result">
                <h3>${escapeHtml(data.title || query)}</h3>
                <p>
                    ${escapeHtml(data.extract || "No description was found.")}
                </p>
                ${
                    data.content_urls?.desktop?.page
                    ? `<a href="${data.content_urls.desktop.page}" target="_blank" rel="noopener">
                        Read more on Wikipedia →
                       </a>`
                    : ""
                }
            </div>
        `;
        
        webContent.innerHTML = html;
        
    } catch (error) {
        webContent.innerHTML = `
            <div class="result">
                <h3>No result found</h3>
                <p>ByteSearch couldn't find information about "${escapeHtml(query)}".</p>
            </div>
        `;
    }
}

// Search on different platforms
function searchOn(platform) {
    const query = searchBox.value.trim();
    
    if (!query) {
        alert('Please enter a search term first');
        return;
    }
    
    const platforms = {
        google: `https://www.google.com/search?q=${encodeURIComponent(query)}`,
        images: `https://www.google.com/search?q=${encodeURIComponent(query)}&tbm=isch`,
        youtube: `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`,
        wikipedia: `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json`,
        reddit: `https://www.reddit.com/search/?q=${encodeURIComponent(query)}`,
        twitter: `https://twitter.com/search?q=${encodeURIComponent(query)}`
    };
    
    if (platforms[platform]) {
        window.open(platforms[platform], '_blank');
    }
}

function searchAgain() {
    const newQuery = searchBox.value.trim();
    
    if (newQuery !== "") {
        window.location.href = "results.html?q=" + encodeURIComponent(newQuery);
    }
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

</script>

</body>
</html>
